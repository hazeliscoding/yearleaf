name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The Rust suite crosses into SQLite and the Tauri IPC boundary, so the
      # crate has to build — and on Linux that means the webkit2gtk stack the
      # `tauri` crate links against, whether or not a window is ever opened.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      # Without this every run recompiles the whole Tauri dependency tree,
      # which is most of the wall clock.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4

      # 24 to match the machine this is developed on, and because the Angular
      # CLI refuses to start below v22.22.3 / v24.15.0 — a bare `22` resolves
      # to whatever patch the runner image happens to carry, which is a version
      # floor decided by someone else's release cadence. Verified: on Node
      # v22.20.0 `ng serve` exits before serving anything and Playwright reports
      # only "Process from config.webServer was not able to start".
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x >=24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium only: `playwright.config.ts` declares no other project, and
      # `--with-deps` brings the shared libraries a headless browser needs on a
      # bare runner.
      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/desktop

      # Packages, desktop unit, Rust, then Playwright. One command so CI and a
      # developer's terminal cannot drift apart: whatever `test:all` means here
      # is what it means there.
      - run: pnpm test:all

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7
