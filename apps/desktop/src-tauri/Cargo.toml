[package]
name = "yearleaf"
version = "0.1.0"
description = "Infinite Desk Calendar — a local-first spatial calendar where time is an infinite canvas."
repository = "https://github.com/hazeliscoding/yearleaf"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yearleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
sha2 = "0.10"
percent-encoding = "2.3"

[dev-dependencies]
# The mock runtime, so the IPC boundary itself can be driven in a test rather
# than only the functions behind it.
tauri = { version = "2.11.3", features = ["test"] }
